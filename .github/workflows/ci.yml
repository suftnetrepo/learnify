name: CI

on:
  push:
    branches: ['**']        # runs on every branch push
  pull_request:
    branches: [main]        # runs on PRs to main

jobs:
  build:
    name: Type check and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: yarn lint
        continue-on-error: true  # lint warnings don't block

      - name: Build
        run: yarn build
        env:
          # Dummy env vars so build doesn't fail
          # Real values are in Render dashboard
          AUTH_SECRET:            dummy_secret_32_chars_minimum_x
          NEXTAUTH_SECRET:        dummy_secret_32_chars_minimum_x
          NEXTAUTH_URL:           http://localhost:3000
          NEXT_PUBLIC_APP_URL:    http://localhost:3000
          DATABASE_URL:           postgresql://dummy:dummy@localhost/dummy
          STUDYMIND_API_KEY:      sm_live_dummy
          STUDYMIND_API_URL:      https://api.aismartlearner.com
          STRIPE_SECRET_KEY:      sk_test_dummy
          STRIPE_WEBHOOK_SECRET:  whsec_dummy
          CLOUDINARY_CLOUD_NAME:  dummy
          CLOUDINARY_API_KEY:     dummy
          CLOUDINARY_API_SECRET:  dummy
          BREVO_API_KEY:          dummy
          BREVO_FROM_EMAIL:       noreply@suftnet.com
          BREVO_FROM_NAME:        Edquis

  test:
    name: Tests
    runs-on: ubuntu-latest

    # Throwaway Postgres for the DB-backed suites (AI Tutor Pass payments, refunds, concurrency)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: learnify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d learnify_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # The migration history can't build a database from scratch (see docs/migration-history.md),
      # so the test database is created from the current schema
      - name: Create test schema
        run: npx drizzle-kit push --force
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/learnify_test

      - name: Run tests
        run: yarn test
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/learnify_test
